# Prometheus, Alertmanager, Grafana and node-exporter for hayaid. Use it with compose.yml:
#
#   docker compose -f compose.yml -f compose.observability.yml up -d
#
# Grafana reads its admin password from docker/secrets/grafana_admin_password. Create
# that file before the first start (docs/install.md, Docker compose).
#
# Ports (on HAYAI_ADMIN_BIND): Prometheus 9090, Alertmanager 9093, Grafana 3000.

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${HAYAI_ADMIN_BIND:-127.0.0.1}:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${HAYAI_ADMIN_BIND:-127.0.0.1}:9093:9093"

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hayaid.json
    secrets:
      - grafana_admin_password
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${HAYAI_ADMIN_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      - prometheus

  # Host CPU, memory and file systems. hayaid exports its own process metrics.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
