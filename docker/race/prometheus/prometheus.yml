# Prometheus of the race (docker/race/compose.monitor.yml).
#
# The targets come from /prometheus/targets.json, which the container writes at its
# start from the variables of compose. Each target has the label `node` (zakurad or
# hayaid): the node, or the node-exporter of the machine of that node. The rules and the
# comparison dashboard group by this label.
#
# The scrape interval is 5 s: at the tip a block comes each 75 s on average, and one
# scrape must read the gauges of one block. Rate windows in the rules are 1 minute.
# A rule that reads the increase of one block has a window of 10 s (2 samples).

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml
  # The container writes network.rules.yml at its start: race:last_checkpoint_height
  # of the network (compose.monitor.yml).
  - /prometheus/*.rules.yml

scrape_configs:
  # The labels of a target set its job: zakurad, hayaid or node.
  - job_name: race
    file_sd_configs:
      - files: [/prometheus/targets.json]
