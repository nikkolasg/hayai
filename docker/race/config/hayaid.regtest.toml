# hayaid for the local dry run of the race files (docs/sync-race.md, Dry run). Regtest,
# loopback addresses only, no seeder. The only peer is the zakurad of
# zakurad.regtest.toml.

[network]
network = "Regtest"
mode = "full"
listen_addr = "127.0.0.1:38344"
peers = ["127.0.0.1:38233"]
compact_relay = false
initial_testnet_peers = []
cache_dir = false

[network.zakura]
trace_dir = "/var/lib/hayai/traces"

[state]
cache_dir = "/var/lib/hayai"

[rpc]
listen_addr = "127.0.0.1:38345"
enable_cookie_auth = true

[metrics]
endpoint_addr = "127.0.0.1:39101"

[trace]
node = "hayaid"

[mining]
# The pay-to-script-hash address of the script OP_TRUE, as in zakurad.regtest.toml.
miner_address = "t2SRyAR26tXTnZHfpa3jPqeyYmxCbAZxUnh"
# The dry run makes blocks with the `generate` method.
regtest_produce = true

[tracing]
filter = "info"
use_color = false

# The same heights as in zakurad.regtest.toml. The chain of the dry run stays in NU6.1.
[regtest]
activation_heights = { nu6 = 50, nu6_1 = 100 }
lockbox_disbursements = [{ address = "t2SRyAR26tXTnZHfpa3jPqeyYmxCbAZxUnh", amount = 0 }]
