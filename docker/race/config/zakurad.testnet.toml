# zakurad of the race on Testnet (docker/race/compose.node.yml, profile zakurad).
# A full sync from the public network, from an empty data directory. The node only
# observes: no miner uses it.
#
# Each key that is not in this file has the default of zakurad: the DNS seeders of
# Testnet, checkpoint sync. The other node of the race is not a peer of this node.

[network]
network = "Testnet"
listen_addr = "[::]:18233"
cache_dir = "/home/zebra/.cache/zakura"
# The legacy stack only (the default of Mainnet). hayaid is a legacy node, and the
# per-block rows of the comparison (legacy_peer_request.jsonl) come from this stack.
p2p_stack = "legacy"
# The same two limits as in hayaid.testnet.toml: 37 outbound and 75 inbound peers,
# 1 connection for each IP address.
peerset_initial_target_size = 25
max_connections_per_ip = 1

[network.zakura]
# The trace tables legacy_sync.jsonl and legacy_peer_request.jsonl.
# `scripts/race_deploy.sh collect` reads them. The writer has a queue of 16,384 rows
# and drops a row when the queue is full. The cost of the trace is not measured;
# hayaid writes its trace tables too.
trace_dir = "/home/zebra/.cache/zakura/traces"

[state]
cache_dir = "/home/zebra/.cache/zakura"

[rpc]
# The loopback address of the host, with the cookie file.
listen_addr = "127.0.0.1:18232"
enable_cookie_auth = true
cookie_dir = "/home/zebra/.cache/zakura"

[metrics]
# The firewall opens this port to the monitoring machine only.
endpoint_addr = "0.0.0.0:9999"

[mining]
# No miner uses this node. hayaid needs the key, so both files have it.
# The address is the Regtest address of Zakura (docker/zakura-regtest-e2e/node1.toml).
miner_address = "tmJymvcUCn1ctbghvTJpXBwHiMEB8P6wxNV"

[tracing]
# The log goes to this file and not to the output of the container: the line
# "downloaded and verified gossiped block" has the commit time of each block at the tip.
log_file = "/home/zebra/.cache/zakura/zakurad.log"
filter = "info"
use_color = false
