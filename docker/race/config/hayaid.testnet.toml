# hayaid of the sync race on Testnet (docker/race/compose.node.yml, profile hayaid).
# A full sync from the public network, from an empty data directory. The image must have
# the zakura crypto backend: the NU7 rules of Testnet need it.
#
# Each key that is not in this file has the default of hayaid: the DNS seeders of
# Testnet, the memory backend of the coins store. The other node of the race is not a
# peer of this node.

[network]
network = "Testnet"
mode = "full"
listen_addr = "[::]:18233"
# A plain legacy node: the public Testnet peers do not have the compact-relay extension.
compact_relay = false
# The same two limits as in zakurad.testnet.toml: 37 outbound and 75 inbound peers,
# 1 connection for each IP address.
peerset_initial_target_size = 25
max_connections_per_ip = 1

[network.zakura]
# The trace tables. `scripts/race_deploy.sh collect` fetches them.
trace_dir = "/var/lib/hayai/traces"

[state]
cache_dir = "/var/lib/hayai"

[rpc]
# The loopback address of the host, with the cookie file /var/lib/hayai/.cookie.
listen_addr = "127.0.0.1:18232"
enable_cookie_auth = true

[metrics]
# The firewall opens this port to the monitoring machine only.
endpoint_addr = "0.0.0.0:19101"

[trace]
node = "hayaid"

[mining]
# No miner uses this node. The key completes the coinbase of the template.
miner_address = "tmJymvcUCn1ctbghvTJpXBwHiMEB8P6wxNV"

[tracing]
filter = "info"
use_color = false
