# Prometheus configuration of the hayai compose stack.
#
# The hayaid targets come from DNS: compose gives the testnet node the name
# hayaid-testnet, the Mainnet node the name hayaid-mainnet and the Regtest node the name
# hayaid-regtest. A name that does not resolve (the other profiles) gives no target. The
# `network` label comes from the name; the alert rules use it.
#
# Rate windows in rules and dashboards are at least 4 scrape intervals (1m at 15s).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: hayaid
    dns_sd_configs:
      - names: [hayaid-testnet, hayaid-mainnet, hayaid-regtest]
        type: A
        port: 19101
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        regex: hayaid-(.+)
        target_label: network
      - source_labels: [__meta_dns_name]
        target_label: instance

  # The upstream node of shadow mode (testnet and mainnet profiles).
  - job_name: zakurad
    dns_sd_configs:
      - names: [zakurad, zakurad-mainnet]
        type: A
        port: 9999
        refresh_interval: 30s
    relabel_configs:
      - target_label: network
        replacement: testnet
      - source_labels: [__meta_dns_name]
        regex: zakurad-mainnet
        target_label: network
        replacement: mainnet
      - source_labels: [__meta_dns_name]
        target_label: instance

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
