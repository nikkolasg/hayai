# Fast checks on each push and pull request, on the default backend: the functional tests,
# the consensus rules of each upgrade and the published test vectors. The jobs build no
# zakura-* crate and no zebra-chain: hayai-bench builds without its `baselines` feature,
# and hayai-fuzz is not in the build. A test in a module named `slow` does not run.
# The full workflow (full.yml) has the comparisons with Zakura and Zebra, the fuzzer, the
# Zakura backend, the slow tests, the minimum Rust version, the benchmarks and the image
# build. No job uses secrets or pushes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # docker/Dockerfile pins the same toolchain: the lowest that builds the whole workspace
  # (zakura-chain 9.0.0 of hayai-bench needs 1.97). The node crates build with the
  # workspace `rust-version`, which the msrv job of full.yml checks.
  RUST_TOOLCHAIN: "1.97.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The release profile keeps debug info for profiling; CI does not need it.
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt && rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --all --check

  # The layering of the crates (scripts/layering.sh): the dependency order of
  # docs/architecture.md, no I/O in a pure crate, no file, socket or database in an
  # in-memory crate, no socket outside the network crates. `cargo tree` resolves the lock
  # file and builds nothing.
  layering:
    name: crate layering
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - run: scripts/layering.sh

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy && rustup default "$RUST_TOOLCHAIN"
      # bindgen of librocksdb-sys needs libclang.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-upstream
      # The default backend without hayai-fuzz. `--no-default-features --features upstream`
      # applies to each selected package: each one has the `upstream` feature, and
      # hayai-bench loses its default feature `baselines`.
      - run: cargo clippy --workspace --exclude hayai-fuzz --no-default-features --features upstream --all-targets --locked -- -D warnings

  test:
    name: test (release, without slow tests)
    runs-on: ubuntu-24.04
    # A test in a module named `slow` runs only in the full workflow (full.yml) and in
    # the local gate. Measured on 2026-10-05 with the fixture cache, on 4 cores of
    # the development machine (`taskset -c 0-3`): the tests use 142 CPU-s and 89 s of wall
    # time. The build is not in this number.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      # bindgen of librocksdb-sys needs libclang.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-upstream
      # Fixtures are generated on first use (real signatures and Orchard proofs). The cache
      # is keyed on the generator.
      - uses: actions/cache@v4
        with:
          path: bench-fixtures
          key: fixtures-${{ hashFiles('crates/hayai-fixtures/src/lib.rs') }}
      # The same package set and features as the clippy job.
      - run: cargo test --workspace --exclude hayai-fuzz --no-default-features --features upstream --release --locked --no-run
      # The quotes are necessary: a plain YAML value cannot end with a colon.
      # The node network tests (`sync_tests`) run several nodes in one process and depend
      # on timing. They run in the next step, one at a time, and do not fail the job
      # until their timing rules are fixed.
      - run: "cargo test --workspace --exclude hayai-fuzz --no-default-features --features upstream --release --locked -- --skip slow:: --skip sync_tests::"
      - name: node network tests (not required yet)
        continue-on-error: true
        run: "cargo test --workspace --exclude hayai-fuzz --no-default-features --features upstream --release --locked -- sync_tests:: --skip slow:: --test-threads=1"

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  compose:
    name: compose files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: compose files
        working-directory: docker
        run: |
          COMPOSE_PROFILES=testnet docker compose -f compose.yml -f compose.observability.yml config -q
          COMPOSE_PROFILES=mainnet docker compose -f compose.yml -f compose.observability.yml config -q
          COMPOSE_PROFILES=regtest docker compose -f compose.yml -f compose.observability.yml config -q
      - name: compose files of the race
        working-directory: docker/race
        run: |
          docker compose -f compose.node.yml config -q
          RACE_NETWORK=testnet docker compose -f compose.node.yml --profile zakurad --profile hayaid config -q
          docker compose -f compose.node.yml --profile zakurad config -q
          docker compose -f compose.node.yml --profile hayaid config -q
          RACE_ZAKURAD_HOST=a.example RACE_HAYAID_HOST=b.example docker compose -f compose.monitor.yml config -q
  observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus configuration and rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/docker/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/docker/observability/prometheus:/etc/prometheus:ro" \
            -w /etc/prometheus/tests prom/prometheus:v3.5.0 test rules hayaid_test.yml
      - name: Prometheus configuration and rules of the race
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/docker/race/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/docker/race/prometheus:/etc/prometheus:ro" \
            -w /etc/prometheus/tests prom/prometheus:v3.5.0 test rules race_test.yml race_blocks_test.yml race_sidecar_test.yml
      - name: Alertmanager configuration
        run: |
          docker run --rm --entrypoint amtool -v "$PWD/docker/observability/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Dashboard and metric names
        run: |
          python3 -m json.tool docker/observability/grafana/dashboards/hayaid.json >/dev/null
          for dashboard in comparison hayai-node zakura-node; do
            python3 -m json.tool "docker/race/grafana/dashboards/${dashboard}.json" >/dev/null
          done
          python3 scripts/check_metric_names.py
      - name: Table of blocks and sidecar of the race
        run: python3 -m unittest scripts/test_race_blocks.py scripts/test_race_sidecar.py

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive deploy/terraform
      - run: terraform -chdir=deploy/terraform/aws init -backend=false -input=false
      - run: terraform -chdir=deploy/terraform/aws validate
      - run: terraform -chdir=deploy/terraform/aws-race init -backend=false -input=false
      - run: terraform -chdir=deploy/terraform/aws-race validate

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh

  # The proofs of formal/: `lake build` checks the committed translation of
  # hayai-consensus-core and the proofs against the pinned Aeneas library. The action
  # installs elan and fetches the Mathlib cache.
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
      # formal/PROGRESS.md follows docs/consensus.md and formal/proven.tsv, and each theorem
      # of proven.tsv exists and uses no sorry.
      - run: python3 formal/scripts/progress.py --check

  # The translation does not drift: the job regenerates formal/Hayai/Core with Charon
  # and Aeneas at the commits of formal/TOOLCHAIN and fails when a generated file differs
  # from the committed one. The Aeneas package of Nix carries Charon and its Rust
  # nightly; the binary cache of the Aeneas project avoids the build.
  formal-extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
      - run: nix build -L "github:AeneasVerif/aeneas/$(sed -n 's/^aeneas //p' formal/TOOLCHAIN)#aeneas" -o aeneas-bin
      - run: PATH="$PWD/aeneas-bin/bin:$PATH" formal/scripts/extract.sh --check
