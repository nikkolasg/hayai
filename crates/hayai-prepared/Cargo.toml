[package]
name = "hayai-prepared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Prepared transactions: context-free verification done once"

[features]
default = ["upstream"]
upstream = [
    "hayai-crypto/upstream",
    "hayai-consensus/upstream",
    "hayai-wire/upstream",
    "hayai-coins/upstream",
]
zakura = [
    "hayai-crypto/zakura",
    "hayai-consensus/zakura",
    "hayai-wire/zakura",
    "hayai-coins/zakura",
]

[dependencies]
hayai-wire.workspace = true
hayai-coins.workspace = true
hayai-crypto.workspace = true
hayai-consensus.workspace = true
blake2b_simd.workspace = true
bytes.workspace = true
ahash.workspace = true
parking_lot.workspace = true
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# The official Sapling parameters (51 MB), for the test that compares the embedded verifying
# keys with them. A test dependency only: no binary holds the parameters.
wagyu-zcash-parameters = "0.2"
