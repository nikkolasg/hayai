[package]
name = "hayai-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "zcashd-compatible getblocktemplate and submitblock over JSON-RPC, served from the live template"

[features]
default = ["upstream"]
upstream = [
    "hayai-crypto/upstream",
    "hayai-wire/upstream",
    "hayai-consensus/upstream",
    "hayai-template/upstream",
    "hayai-http/upstream",
    "hayai-metrics/upstream",
]
zakura = [
    "hayai-crypto/zakura",
    "hayai-wire/zakura",
    "hayai-consensus/zakura",
    "hayai-template/zakura",
    "hayai-http/zakura",
    "hayai-metrics/zakura",
]

[dependencies]
hayai-crypto.workspace = true
hayai-wire.workspace = true
hayai-consensus.workspace = true
hayai-template.workspace = true
hayai-http.workspace = true
hayai-metrics.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
