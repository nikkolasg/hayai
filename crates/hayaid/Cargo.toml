[package]
name = "hayaid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The hayai node binary: the configuration file, the signals and the logs around hayai-node"

[features]
default = ["upstream"]
upstream = ["hayai-node/upstream", "hayai-fixtures/upstream"]
zakura = ["hayai-node/zakura", "hayai-fixtures/zakura"]

[dependencies]
hayai-node.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
signal-hook.workspace = true

[dev-dependencies]
# The Regtest spend builder of the pair tests (`hayai_fixtures::regtest`).
hayai-fixtures.workspace = true
tempfile.workspace = true
serde_json.workspace = true
bytes.workspace = true
hayai-crypto.workspace = true
hayai-wire.workspace = true
hayai-consensus.workspace = true
hayai-net.workspace = true
hayai-rpc.workspace = true
hayai-http.workspace = true
hayai-metrics.workspace = true
hex.workspace = true

# The Regtest pair of one hayaid and one zakurad (`docs/regtest-pair.md`). It has its own
# `main`: the path of the zakurad binary is a command-line argument. Without that argument
# it runs nothing.
[[test]]
name = "zakura_pair"
path = "tests/zakura_pair/main.rs"
harness = false
