[package]
name = "hayaid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The hayai node binary: Regtest full node and Testnet shadow follower"

[features]
default = ["upstream"]
upstream = [
    "hayai-crypto/upstream",
    "hayai-consensus/upstream",
    "hayai-wire/upstream",
    "hayai-coins/upstream",
    "hayai-trees/upstream",
    "hayai-prepared/upstream",
    "hayai-state/upstream",
    "hayai-validate/upstream",
    "hayai-relay/upstream",
    "hayai-template/upstream",
    "hayai-blockstore/upstream",
    "hayai-index/upstream",
    "hayai-net/upstream",
    "hayai-sync/upstream",
    "hayai-rpc/upstream",
]
zakura = [
    "hayai-crypto/zakura",
    "hayai-consensus/zakura",
    "hayai-wire/zakura",
    "hayai-coins/zakura",
    "hayai-trees/zakura",
    "hayai-prepared/zakura",
    "hayai-state/zakura",
    "hayai-validate/zakura",
    "hayai-relay/zakura",
    "hayai-template/zakura",
    "hayai-blockstore/zakura",
    "hayai-index/zakura",
    "hayai-net/zakura",
    "hayai-sync/zakura",
    "hayai-rpc/zakura",
]

[dependencies]
hayai-crypto.workspace = true
hayai-consensus.workspace = true
hayai-wire.workspace = true
hayai-coins.workspace = true
hayai-trees.workspace = true
hayai-prepared.workspace = true
hayai-state.workspace = true
hayai-validate.workspace = true
hayai-relay.workspace = true
hayai-template.workspace = true
hayai-blockstore.workspace = true
hayai-index.workspace = true
hayai-net.workspace = true
hayai-sync.workspace = true
hayai-rpc.workspace = true
hayai-trace.workspace = true
rand.workspace = true
crc32c.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
signal-hook.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The Regtest pair of one hayaid and one zakurad (`docs/regtest-pair.md`). It has its own
# `main`: the path of the zakurad binary is a command-line argument. Without that argument
# it runs nothing.
[[test]]
name = "zakura_pair"
path = "tests/zakura_pair/main.rs"
harness = false
