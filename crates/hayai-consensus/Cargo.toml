[package]
name = "hayai-consensus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The networks and the adapter around the pure consensus core"

[features]
default = ["upstream"]
upstream = ["hayai-crypto/upstream", "hayai-wire/upstream", "hayai-consensus-core/upstream"]
zakura = ["hayai-crypto/zakura", "hayai-wire/zakura", "hayai-consensus-core/zakura"]

[dependencies]
hayai-consensus-core.workspace = true
hayai-crypto.workspace = true
hayai-wire.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
# The reference implementation of the difficulty tests: big integers that share no code
# with the `U256` of the rule.
num-bigint = "0.4"
